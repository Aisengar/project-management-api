$kind: http-request
url: "{{baseUrl}}/users"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status: 200", () =>{
          pm.response.to.have.status(200);
      })

      pm.test("Devuelve una lista sin contraseñas", () => {
          const users = pm.response.json();
          pm.expect(users).to.be.an("array").that.is.not.empty;
          users.forEach(u => pm.expect(u).to.not.have.property("password"));
      });
    language: text/javascript
order: 2616310378801517
